; =============================================================================
;  TR2013 HUD Fix+ 1.4.5 - Tomb Raider (2013) MP-safe HUD position fix
;  Konfiguration / Configuration
;
;  Tasten / Keys: Tastenname oder Virtual-Key-Code, 0 = keine Taste.
;  Key name or virtual-key code, 0 = no key.
;  Namen / names: F1..F12, A..Z, 0..9, INSERT (EINFG), DELETE (ENTF),
;  HOME (POS1), END (ENDE), PAGE UP (BILDAUF), PAGE DOWN (BILDAB),
;  NUM 0..NUM 9, PAUSE, SCROLL LOCK, TAB, SPACE ... (z. B. / e.g. 0x78 = F9)
;
;  WICHTIG: Kommentare nur in eigenen Zeilen (mit ';' am Zeilenanfang),
;           NIE hinter einem Wert.
;  IMPORTANT: Put comments on their own lines (starting with ';'),
;             NEVER behind a value.
; =============================================================================

[General]
; 1 = HUD-Korrektur aktiv (Einstellungen in [Fix]), 0 = aus (reine Durchreichung).
; 1 = HUD correction enabled (settings in [Fix]), 0 = off (pure pass-through).
EnableFix=1
; Log tr_hud_fix.log im Spielordner (Diagnose, standardmaessig aus):
; 0 = kein Log (Standard; keine Diagnose-Arbeit, keine Log-Datei),
; 1 = vollstaendiges Analyse-Log (inkl. F10-Aufnahme),
; 2 = nur Waechter (HUD-Anomalien, Abstuerze, Geraete-/Anzeige-Ereignisse; klein,
; empfohlen fuer Fehlerberichte). Einstellungen dazu in [Logging] und [Capture].
; Log tr_hud_fix.log in the game folder (diagnostics, off by default):
; 0 = no log (default; no diagnostic work, no log file),
; 1 = full analysis log (incl. F10 capture),
; 2 = watchdog only (HUD anomalies, crashes, device/display events; small,
; recommended for bug reports). Settings in [Logging] and [Capture].
EnableLogging=0
; 1 = Draw-Hooks automatisch wiederherstellen, wenn die D3D11-Runtime ihre
;     Funktionstabelle umschreibt (noetig, damit Draw-Aufrufe sichtbar bleiben).
;     Aktiv, wenn Fix, Menue oder Logging aktiv ist. 0 = aus.
; 1 = re-arm the draw hooks whenever the D3D11 runtime rewrites its function
;     table (needed to keep seeing draw calls). Active if the fix, the menu or
;     logging is active. 0 = off.
RearmDrawHooks=1

[Fix]
; Die Korrektur veraendert nie Spielspeicher: betroffene HUD-Draws bekommen fuer
; genau diesen Draw eine korrigierte Kopie ihrer Matrix in einem eigenen Buffer.
; The fix never modifies game memory: affected HUD draws get a corrected copy of
; their matrix in our own buffer for exactly that one draw.
;
; Bytecode-Hashes der HUD-Vertex-Shader (aus [SHADER]-Logzeilen), kommagetrennt.
; Bytecode hashes of the HUD vertex shaders (from [SHADER] log lines), comma-separated.
HudVsHashes=8FE65884BC7EA6DE,95CD56AF476CBD7D,15A962EB1FFFCD0D
; Meldungen unten rechts (Waffenverbesserung, Fertigkeitspunkt ...):
; Notifications at the bottom right (weapon upgrade, skill point ...):
; Horizontale Verschiebung in NDC (-0.5200 = ca. 666 Pixel nach links bei 2560 px Breite).
; Horizontal shift in NDC (-0.5200 = about 666 pixels to the left at 2560 px width).
ShiftNdcX=-0.5200
; Vertikale Verschiebung in NDC (positiv = nach oben), 0 = keine.
; Vertical shift in NDC (positive = up), 0 = none.
ShiftNdcY=0.0
; Skalierung der Meldung (0.50..1.50) um den Drehpunkt PopupPivotNdcX/Y
; (rechter Rand / vertikale Mitte der Meldung).
; Scale of the notification (0.50..1.50) around the pivot PopupPivotNdcX/Y
; (right edge / vertical centre of the notification).
PopupScale=1.00
PopupPivotNdcX=0.97
PopupPivotNdcY=-0.71
; "Schwarzer Fleck" oben (Hintergrund der Aufsammel-Meldung, vom Spiel manchmal
; in der Ecke oben links gelassen): 0 = aus, 1 = an die richtige Stelle schieben,
; 2 = ausblenden.
; "Black stain" at the top (backdrop of the pickup message that the game
; sometimes leaves in the top-left corner): 0 = off, 1 = move to the correct
; position, 2 = hide.
FixBackdrop=1
; Pixel-Shader-Hash des Hintergrunds (aus [SHADER]-Logzeilen) und Zielanker (NDC).
; Pixel shader hash of the backdrop (from [SHADER] log lines) and target anchor (NDC).
BackdropPsHash=EF336D585C6DE33E
BackdropTargetNdcX=0.3963
BackdropTargetNdcY=0.9306
; Interaktions-Hinweis ("DRUECKEN SIE [E] ...") erscheint manchmal oben links:
; 1 = an die richtige Stelle (unten mittig) schieben, 0 = aus.
; Interaction prompt ("PRESS [E] ...") sometimes appears in the top-left
; corner: 1 = move it back to its place (bottom centre), 0 = off.
FixPrompt=1
; Erkennung der Ebenen ueber c3.w der HUD-Matrix und fehlende Ursprungsposition
; der Hinweis-Ebene in NDC (nur bei Bedarf aendern).
; Layer detection via c3.w of the HUD matrix and the missing root position of
; the prompt layer in NDC (change only if needed).
PromptLayerW=12313.5
PromptShiftNdcX=0.99844
PromptShiftNdcY=-1.83333
HudLayerW=24627
; Absolute Toleranz fuer die Ebenen-Werte (w) oben, getrennt fuer HUD- und
; Hinweis-Ebene. Das HUD-w schwankt je nach Seitenverhaeltnis leicht
; (16:9 24627.0, 16:10 24619.3, 5:4 24623.1, 4:3 24636.6); Menue-Ebenen liegen
; mindestens 29 entfernt.
; Absolute tolerance for the layer values (w) above, separate for the HUD and
; the prompt layer. The HUD w varies slightly with the aspect ratio
; (16:9 24627.0, 16:10 24619.3, 5:4 24623.1, 4:3 24636.6); menu layers are at
; least 29 away.
HudLayerTol=15.0
PromptLayerTol=8.0
; Menue-Erkennung: Korrekturen nur im Spiel, Menues werden nie veraendert.
; Weniger als MenuMinSceneDraws 3D-Draws vor dem ersten HUD-Element = Menue;
; Elemente mit Skalierung >= MenuLargeScale = Vollbild-Menuegrafik;
; MenuHoldFrames = Menue-Zustand so viele Frames nach dem letzten Signal halten.
; Menu detection: fixes in gameplay only, menus are never modified.
; Fewer than MenuMinSceneDraws 3D draws before the first HUD element = menu;
; elements with scale >= MenuLargeScale = full-screen menu image;
; MenuHoldFrames = keep the menu state this many frames after the last signal.
MenuMinSceneDraws=150
MenuLargeScale=0.00014
MenuHoldFrames=2
; Meldung (Fertigkeitspunkt, Waffenverbesserung ...) erscheint manchmal oben
; links: 1 = an die urspruengliche Stelle unten rechts schieben, 0 = aus.
; Notification (skill point, weapon upgrade ...) sometimes appears in the
; top-left corner: 1 = move it back to its original bottom-right place, 0 = off.
FixPopupOrigin=1
; Verschiebung in NDC und Pixel-Shader-Hash der Meldungs-Hintergruende (Ausloeser).
; Shift in NDC and pixel shader hash of the notification backgrounds (trigger).
PopupOriginShiftNdcX=1.7238
PopupOriginShiftNdcY=-1.7258
PopupOriginTriggerPsHash=300305651E200543
; Bergungsgut-Zaehler erscheint oben links (ohne Beschriftung): 1 = an die
; urspruengliche Stelle oben rechts schieben (Layout vor 2021), 0 = aus.
; Salvage counter appears in the top-left corner (without its label): 1 = move it
; back to its original top-right place (pre-2021 layout), 0 = off.
FixSalvage=1
; Verschiebung des Bergungsgut-Zaehlers in NDC (2.0 = volle Bildbreite/-hoehe).
; Shift of the salvage counter in NDC (2.0 = full screen width/height).
SalvageShiftNdcX=1.6055
SalvageShiftNdcY=-0.0667
; Taste zum Ein-/Ausschalten der Korrektur im Spiel, 0 = aus.
; Key to toggle the correction in game, 0 = off.
ToggleHotkey=F9

[Menu]
; Taste fuer das Ingame-Menue, 0 = kein Menue.
; Key for the in-game menu, 0 = no menu.
; Hinweis: solange das Menue verfuegbar ist, laufen die Fix-Vorbereitungen auch
; bei EnableFix=0, damit der Fix im Menue live eingeschaltet werden kann.
; Note: while the menu is available, the fix infrastructure also runs with
; EnableFix=0 so that the fix can be switched on live from the menu.
MenuHotkey=INSERT
; Menue-Skalierung, 0 = automatisch (Bildhoehe / 1080). Das Menue ist englisch.
; Menu scale, 0 = automatic (screen height / 1080). The menu is in English.
MenuScale=0
; 1 = erweiterte Regler im Menue (Verschiebung/Skalierung der Meldungen unten
;     rechts, Werte ShiftNdcX/ShiftNdcY/PopupScale in [Fix]), 0 = ausgeblendet.
;     Die Werte sind kalibriert; nur bei Bedarf aendern.
; 1 = advanced sliders in the menu (offset/scale of the bottom-right
;     notifications, values ShiftNdcX/ShiftNdcY/PopupScale in [Fix]), 0 = hidden.
;     The values are calibrated; change them only if needed.
ShowAdvanced=0

[Perf]
; Bildratenbegrenzung: 0 = aus, sonst Ziel-FPS (20..360). Am besten mit
; ausgeschaltetem VSync im Spiel.
; Frame rate limit: 0 = off, else target FPS (20..360). Best with in-game
; VSync off.
FpsLimit=0
; 1 = kleine FPS-Anzeige oben rechts (auch bei geschlossenem Menue), 0 = aus.
; 1 = small FPS counter in the top-right corner (also with the menu closed), 0 = off.
ShowFpsOverlay=0
; Taste zum Ein-/Ausblenden der FPS-Anzeige (z. B. F11), 0 = keine Taste.
; Key to toggle the FPS counter (e.g. F11), 0 = no key.
OverlayHotkey=0

[Display]
; Wirksam erst nach einem Neustart des Spiels. / Takes effect after a game restart.
; 1 = randloses Vollbild statt exklusivem Vollbild, 0 = aus.
; 1 = borderless fullscreen instead of exclusive fullscreen, 0 = off.
Borderless=0
; 1 = modernes Flip-Praesentationsmodell (fortgeschritten), 0 = klassisch.
; 1 = modern flip presentation model (advanced), 0 = legacy.
FlipModel=0
; 1 = Tearing/VRR bei ausgeschaltetem VSync erlauben (nur mit FlipModel=1).
; 1 = allow tearing/VRR with VSync off (only with FlipModel=1).
AllowTearing=0

[Proxy]
; Nur fuer d3d11.dll (Proxy): DLL, an die weitergeleitet wird (Chain-Loading),
; z. B. ProxyDll=d3d11_dxvk.dll (relativ zum Spielordner) oder absoluter Pfad.
; Leer = automatisch: d3d11_orig.dll, dxvk_d3d11.dll, sonst System-d3d11.dll.
; Only for d3d11.dll (proxy): DLL to chain to, e.g. ProxyDll=d3d11_dxvk.dll
; (relative to the game folder) or an absolute path.
; Empty = automatic: d3d11_orig.dll, dxvk_d3d11.dll, else the system d3d11.dll.
ProxyDll=

; =============================================================================
;  Diagnose (nur wirksam mit EnableLogging=1 oder 2)
;  Diagnostics (only effective with EnableLogging=1 or 2)
; =============================================================================

[Logging]
; Max. Anzahl eindeutiger Eintraege pro Log-Kategorie (Schutz vor Log-Spam).
; Max. number of unique entries per log category (prevents log spam).
MaxUniqueEntries=4096
; Max. Bytes pro Constant-Buffer-Dump (16..4096, Vielfaches von 16).
; Max. bytes per constant-buffer dump (16..4096, multiple of 16).
CBDumpMaxBytes=256
; Anzahl Dumps pro Constant-Buffer-Signatur (0 = keine Dumps).
; Number of dumps per constant-buffer signature (0 = no dumps).
CBDumpSamplesPerSig=3
; Maximale Groesse des Logs in MB (1..1024). Danach wird nicht mehr geschrieben.
; Maximum log size in MB (1..1024). Logging stops when it is reached.
MaxLogMB=50
; Waechter: automatische Detail-Aufnahmen bei neuen HUD-Fehlern (pro Sitzung,
; 0 = keine) und Mindestabstand zwischen zwei Aufnahmen in Sekunden.
; Watchdog: automatic detailed captures for new HUD errors (per session,
; 0 = none) and minimum gap between two captures in seconds.
AutoCaptureMax=5
AutoCaptureMinGapSec=120
; Waechter (EnableLogging 1 oder 2): alle WatchSampleMs Millisekunden wird ein
; einzelnes Bild auf HUD-Elemente geprueft, die groesstenteils ausserhalb des
; Bildschirms liegen ([WATCH] OFF). 0 = aus, sonst 100..60000.
; Watchdog (EnableLogging 1 or 2): every WatchSampleMs milliseconds one single
; frame is checked for HUD elements drawn mostly off-screen ([WATCH] OFF).
; 0 = off, else 100..60000.
WatchSampleMs=1000
; Speicher-Protokoll (EnableLogging 1 oder 2): alle MemLogSec Sekunden eine
; [MEM]-Zeile (Prozess-Speicher, Adressraum). 0 = aus, sonst 5..3600.
; Memory telemetry (EnableLogging 1 or 2): one [MEM] line every MemLogSec
; seconds (process memory, address space). 0 = off, else 5..3600.
MemLogSec=60
; HUD-Inventar (EnableLogging 1 oder 2): jedes neue Element der HUD- oder
; Hinweis-Ebene einmal als [INV]-Zeile protokollieren (Ebene, Shader, Anker,
; angewandte Regel). Nur im Spiel - Menues und andere UI-Ebenen werden nicht
; erfasst. 1 = an, 0 = aus.
; HUD inventory (EnableLogging 1 or 2): log every new element of the HUD or
; prompt layer once as an [INV] line (layer, shaders, anchor, applied rule).
; Gameplay only - menus and other UI layers are not recorded.
; 1 = on, 0 = off.
InventoryEnable=1

[Capture]
; Zeitgesteuerte Detail-Aufnahme per Hotkey (nur bei EnableLogging=1).
; Taste druecken -> ab dem naechsten Frame wird fuer CaptureFrames Frames
; JEDER Draw-Aufruf geloggt ([CAP-DRAW]) samt der davon benutzten
; Constant-Buffer-Inhalte ([CAP-CB]).
; Detailed capture via hotkey (only with EnableLogging=1).
; Press the key -> starting with the next frame, EVERY draw of CaptureFrames
; frames is logged ([CAP-DRAW]) plus the constant-buffer contents it uses
; ([CAP-CB]).
;
; Taste fuer die Aufnahme (z. B. F10), 0 = aus.
; Key for the capture (e.g. F10), 0 = off.
CaptureHotkey=F10
; Anzahl aufgenommener Frames (1..60).
; Number of captured frames (1..60).
CaptureFrames=3
; Ersatz, falls kein Present-Hook moeglich ist: Dauer in Sekunden (1..600).
; Fallback if no Present hook is possible: duration in seconds (1..600).
CaptureSeconds=15
; Max. Bytes pro Constant-Buffer in der Aufnahme (16..4096, Vielfaches von 16).
; Groessere Buffer werden nur per Hash referenziert, nicht ausgegeben.
; Max. bytes per constant buffer during a capture (16..4096, multiple of 16).
; Larger buffers are only referenced by hash, not printed.
CaptureMaxCBBytes=512
; Max. Bytes pro Vertex-/Index-Buffer, die in der Aufnahme gespiegelt werden
; (4096..16777216). Daraus werden die Positionen der Draws ([CAP-VTX]) gelesen.
; Max. bytes per vertex/index buffer mirrored during a capture
; (4096..16777216). Used to decode the draw positions ([CAP-VTX]).
CaptureMaxVBBytes=262144
; Aufnahme endet vorzeitig nach so vielen Logzeilen (Schutz vor Riesen-Logs).
; Capture ends early after this many log lines (prevents huge logs).
CaptureMaxLines=400000
